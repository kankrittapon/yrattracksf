[project]
name = "sailfish-collector"
version = "0.1.0"
description = "Private SailFish race collector and Tailscale control API"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.29",
  "cryptography>=43.0",
  "fastapi>=0.115",
  "httpx>=0.27",
  "lzstring>=1.0.4",
  "pydantic-settings>=2.5",
  "pyjwt[crypto]>=2.9",
  "uvicorn[standard]>=0.30",
  "websockets>=13.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
