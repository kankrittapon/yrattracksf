<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SailFish Inspector</title>
  <style>
    body{width:310px;margin:0;padding:16px;background:#071b22;color:#fff;font:14px system-ui,sans-serif}
    h1{margin:0 0 10px;color:#4ee0cf;font-size:18px}
    .card{padding:12px;border-radius:10px;background:#102d36;margin-bottom:10px}
    .count{font-size:28px;font-weight:700}
    .meta{color:#a8c6cc;font-size:12px;line-height:1.5}
    button{width:100%;border:0;border-radius:8px;padding:10px;margin-top:8px;color:#fff;background:#2878e0;font-weight:700}
    button.clear{background:#9d3c49}
    #status{min-height:18px;margin-top:10px;color:#4ee0cf;font-size:12px}
  </style>
</head>
<body>
  <h1>SailFish Network Inspector</h1>
  <div class="card">
    <div class="count" id="count">0</div>
    <div class="meta">
      รายการที่เก็บไว้<br>
      ตัดรายการเก่าแล้ว: <span id="dropped">0</span><br>
      ขนาดโดยประมาณ: <span id="size">0 KB</span>
    </div>
  </div>
  <button id="capture">เริ่มจับ WebSocket</button>
  <button id="export">Export JSON</button>
  <button id="clear" class="clear">ล้าง Log</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
